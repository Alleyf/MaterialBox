name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Create Chrome zip
        run: |
          cd dist/chrome
          zip -r ../materialbox-chrome.zip .
          cd ../..

      - name: Create Firefox zip
        run: |
          cd dist/firefox
          zip -r ../materialbox-firefox.zip .
          cd ../..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: |
            dist/materialbox-chrome.zip
            dist/materialbox-firefox.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: browser-packages
          path: dist

      - name: Extract changelog for this release
        id: changelog
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Extracting changelog for version: $TAG_VERSION"
          
          # Extract the section for this version from CHANGELOG.md
          CHANGELOG_CONTENT=$(awk -v version="v$TAG_VERSION" '
            /^## \[v/ {
              if (section_found) exit
              if ($0 ~ version) {
                section_found=1
                next
              }
            }
            section_found && /^## \[v/ { exit }
            section_found { print }
          ' CHANGELOG.md)
          
          # Save to a temporary file
          echo "$CHANGELOG_CONTENT" > release_notes.md
          echo "changelog_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/materialbox-chrome.zip
            dist/materialbox-firefox.zip
          body_path: ${{ steps.changelog.outputs.changelog_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
