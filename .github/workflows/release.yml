name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Create Chrome zip
        run: |
          cd dist/chrome
          zip -r ../materialbox-chrome.zip .
          cd ../..

      - name: Create Firefox zip
        run: |
          cd dist/firefox
          zip -r ../materialbox-firefox.zip .
          cd ../..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: |
            dist/materialbox-chrome.zip
            dist/materialbox-firefox.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: browser-packages
          path: dist

      - name: Extract changelog for this release
        id: changelog
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Extracting changelog for version: $TAG_VERSION"

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not found, using default message" > release_notes.md
            echo "changelog_file=release_notes.md" >> $GITHUB_OUTPUT
            exit 0
          fi

          TARGET_VERSION="v$TAG_VERSION"
          FOUND_CONTENT=""

          while IFS= read -r line; do
            if [[ "$line" =~ ^##\ \[v[^]]+\] ]]; then
              if [ -n "$FOUND_CONTENT" ]; then
                break
              fi
              if [[ "$line" == *"$TARGET_VERSION"* ]]; then
                FOUND_CONTENT="1"
              fi
            elif [ -n "$FOUND_CONTENT" ]; then
              echo "$line"
            fi
          done < CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "Release $TAG_VERSION" > release_notes.md
          fi
          echo "changelog_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/materialbox-chrome.zip
            dist/materialbox-firefox.zip
          body_path: ${{ steps.changelog.outputs.changelog_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
